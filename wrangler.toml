name = "quranlounge"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
main = "functions/[[path]].js"

[assets]
directory = "./dist"

[vars]
NPM_FLAGS = "--no-package-lock"
# For local dev only — production values are set via `wrangler pages secret put`
# QURAN_CLIENT_ID and QURAN_CLIENT_SECRET must be set as Cloudflare Pages secrets

# KV Namespace binding for token and data caching
[[kv_namespaces]]
binding = "QURAN_CACHE"
id = "d601ae5713af43deab1dae4885cbcdc3"

[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "quran-lounge"
